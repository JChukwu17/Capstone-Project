name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Run pipeline (smoke test)
        run: |
          python scripts/run_pipeline.py

      - name: Run chart export (smoke test)
        run: |
          python scripts/export_charts.py

      - name: Verify chart outputs
        run: |
          for f in assets/palette_swatch.png \
                    assets/chart_price_distribution.png \
                    assets/chart_category_comparison.png \
                    assets/chart_value_vs_price.png \
                    assets/chart_top_products.png; do
            if [ ! -f "$f" ]; then
              echo "FAILED: $f not produced"
              exit 1
            fi
            echo "OK: $f ($(stat -c%s "$f") bytes)"
          done
